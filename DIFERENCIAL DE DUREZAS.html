<style>

  .vacio{color:#94a3b8;font-size:.85rem;font-style:italic;padding:6px 2px}

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const esNum = v => typeof v === 'number' && isFinite(v);
const promedio = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;

function rango(a){
  if(!a.length) return '—';
  const min = Math.min(...a), max = Math.max(...a);
  const f = v => Number.isInteger(v) ? String(v) : v.toFixed(1);
  return min === max ? f(min) : f(min) + ' – ' + f(max);
}
function disperso(a){
  if(a.length < 2) return false;
  const p = promedio(a);
  if(!p) return false;
  return (Math.max(...a) - Math.min(...a)) > 0.25 * p;
}
function normalizar(nombre){
  return String(nombre)
    .replace(/\s*medici[oó]n\s*#\s*\d+/gi, '')
    .replace(/\s*medida\s*#\s*\d+/gi, '')
    .replace(/\s+/g, ' ')
    .trim();
}

let idCounter = 0;
const filas = DATOS.map(d => ({
  id: idCounter++,
  nombre: d[0],
  hb: d[1],
  hrc: d[2],
  grupo: normalizar(d[0])
}));

let combinaciones = [];

/* =========================================================
   Construcción de grupos
   ========================================================= */
function construirGrupos(){
  const map = new Map();
  for(const f of filas){
    const nombre = (f.grupo || '').trim() || '(sin grupo)';
    let g = map.get(nombre);
    if(!g){ g = { nombre, hb: [], hrc: [], filas: [] }; map.set(nombre, g); }
    if(esNum(f.hb))  g.hb.push(f.hb);
    if(esNum(f.hrc)) g.hrc.push(f.hrc);
    g.filas.push(f);
  }
  return map;
}

/* =========================================================
   Render tabla de promedios
   ========================================================= */
function renderPromedios(){
  const grupos = construirGrupos();
  const lista = [...grupos.values()];
  const maxMed = lista.reduce((m,g) => Math.max(m, g.filas.length), 0);

  const head = $('#headPromedios');
  let h = '<th>Componente</th>' +
          '<th class="num">N° med.</th>' +
          '<th class="num">HB prom.</th>' +
          '<th class="num">HRC prom.</th>' +
          '<th class="num">Rango HB</th>' +
          '<th class="num">Rango HRC</th>';
  for(let i = 1; i <= maxMed; i++) h += '<th class="num">Medición ' + i + '</th>';
  head.innerHTML = h;

  const tbody = $('#tablaPromedios tbody');
  tbody.innerHTML = '';
  let totalMed = 0;

  for(const g of lista){
    totalMed += g.filas.length;
    const phb  = promedio(g.hb);
    const phrc = promedio(g.hrc);
    const warnHB  = disperso(g.hb)  ? '<span class="warn" title="Dispersión alta"> ⚠</span>' : '';
    const warnHRC = disperso(g.hrc) ? '<span class="warn" title="Dispersión alta"> ⚠</span>' : '';

    let tds = '<td><div class="nombre-wrap">' +
                '<input class="nombre-grupo" data-grupo="' + esc(g.nombre) + '" value="' + esc(g.nombre) + '">' +
                '<button class="mini btn-del-grupo" data-grupo="' + esc(g.nombre) + '" title="Eliminar componente">×</button>' +
              '</div></td>' +
      '<td class="num">' + g.filas.length + '</td>' +
      '<td class="num strong">' + (phb  === null ? '—' : phb.toFixed(1))  + warnHB  + '</td>' +
      '<td class="num strong">' + (phrc === null ? '—' : phrc.toFixed(1)) + warnHRC + '</td>' +
      '<td class="num small">' + rango(g.hb)  + '</td>' +
      '<td class="num small">' + rango(g.hrc) + '</td>';

    for(let i = 0; i < maxMed; i++){
      const f = g.filas[i];
      if(!f){ tds += '<td class="med small">—</td>'; continue; }
      const hbVal  = esNum(f.hb)  ? f.hb  : '';
      const hrcVal = esNum(f.hrc) ? f.hrc : '';
      tds += '<td class="med">' +
        '<input type="number" step="any" class="hb' + (hbVal === '' ? ' vacio' : '') +
          '" data-id="' + f.id + '" data-campo="hb"  value="' + hbVal  + '" placeholder="HB">' +
        '<input type="number" step="any" class="hrc' + (hrcVal === '' ? ' vacio' : '') +
          '" data-id="' + f.id + '" data-campo="hrc" value="' + hrcVal + '" placeholder="HRC">' +
      '</td>';
    }

    const tr = document.createElement('tr');
    tr.innerHTML = tds;
    tbody.appendChild(tr);
  }

  $('#resumen').textContent =
    lista.length + ' componentes · ' + totalMed + ' mediciones';
}

/* =========================================================
   Actualización de una fila in-place (para no perder foco)
   ========================================================= */
function actualizarFila(f){
  const inp = document.querySelector('input[data-id="' + f.id + '"][data-campo="hb"]');
  if(!inp) return;
  const tr = inp.closest('tr');
  if(!tr) return;

  const grupoNombre = (f.grupo || '').trim() || '(sin grupo)';
  const g = construirGrupos().get(grupoNombre);
  if(!g) return;

  const phb  = promedio(g.hb);
  const phrc = promedio(g.hrc);
  const warnHB  = disperso(g.hb)  ? '<span class="warn" title="Dispersión alta"> ⚠</span>' : '';
  const warnHRC = disperso(g.hrc) ? '<span class="warn" title="Dispersión alta"> ⚠</span>' : '';

  const celdas = tr.querySelectorAll('td');
  celdas[1].textContent = g.filas.length;
  celdas[2].innerHTML = (phb  === null ? '—' : phb.toFixed(1))  + warnHB;
  celdas[3].innerHTML = (phrc === null ? '—' : phrc.toFixed(1)) + warnHRC;
  celdas[4].textContent = rango(g.hb);
  celdas[5].textContent = rango(g.hrc);

  actualizarResumen();
}

function actualizarResumen(){
  const grupos = construirGrupos();
  let total = 0;
  for(const g of grupos.values()) total += g.filas.length;
  $('#resumen').textContent = grupos.size + ' componentes · ' + total + ' mediciones';
}

/* =========================================================
   Comparador Δ
   ========================================================= */
function bloqueDelta(escala, va, vb, dec){
  if(va === null || vb === null){
    return '<div class="fila-delta">' +
             '<span class="escala">' + escala + '</span>' +
             '<span class="sin-datos">Sin datos</span>' +
           '</div>';
  }
  const d   = va - vb;
  const pct = vb !== 0 ? (d / vb) * 100 : null;
  const igual = Math.abs(d) < 1e-9;
  const cls = igual ? 'igual' : (d > 0 ? 'pos' : 'neg');
  const etq = igual ? 'Iguales' : (d > 0 ? 'A es más duro' : 'B es más duro');

  return '<div class="fila-delta">' +
    '<span class="escala">' + escala + '</span>' +
    '<span class="val">A: <b>' + va.toFixed(dec) + '</b></span>' +
    '<span class="val">B: <b>' + vb.toFixed(dec) + '</b></span>' +
    '<span class="delta ' + cls + '">Δ ' + (d > 0 ? '+' : '') + d.toFixed(dec) + '</span>' +
    '<span class="pct">' + (pct === null ? '' : (pct > 0 ? '+' : '') + pct.toFixed(1) + ' %') + '</span>' +
    '<span class="etq ' + cls + '">' + etq + '</span>' +
  '</div>';
}

function renderComparador(){
  const grupos = construirGrupos();
  const nombres = [...grupos.keys()];
  const cont = $('#listaComparaciones');
  cont.innerHTML = '';

  if(!combinaciones.length){
    cont.innerHTML = '<p class="vacio">Sin combinaciones.</p>';
    return;
  }

  const opciones = sel => {
    const set = new Set(nombres);
    if(sel && !set.has(sel)) set.add(sel);
    return [...set].map(n =>
      '<option value="' + esc(n) + '"' + (n === sel ? ' selected' : '') + '>' +
      esc(n) + '</option>').join('');
  };

  combinaciones.forEach((c, idx) => {
    const A = grupos.get(c.a);
    const B = grupos.get(c.b);
    const hbA  = A ? promedio(A.hb)  : null;
    const hbB  = B ? promedio(B.hb)  : null;
    const hrcA = A ? promedio(A.hrc) : null;
    const hrcB = B ? promedio(B.hrc) : null;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-head">' +
        '<span class="badge">' + (idx + 1) + '</span>' +
        '<select class="sel sel-a" data-idx="' + idx + '">' + opciones(c.a) + '</select>' +
        '<span class="vs">vs</span>' +
        '<select class="sel sel-b" data-idx="' + idx + '">' + opciones(c.b) + '</select>' +
        '<button class="mini sec btn-swap" data-idx="' + idx + '" title="Invertir">⇄</button>' +
        '<button class="mini peligro btn-quitar" data-idx="' + idx + '">Quitar</button>' +
      '</div>' +
      '<div class="deltas">' +
        bloqueDelta('HB',  hbA,  hbB,  1) +
        bloqueDelta('HRC', hrcA, hrcB, 1) +
      '</div>';
    cont.appendChild(card);
  });
}

/* =========================================================
   Eventos: editar mediciones / nombre / eliminar grupo
   ========================================================= */
$('#tablaPromedios').addEventListener('input', e => {
  const inp = e.target;
  if(!inp.matches('input[data-id]')) return;
  const f = filas.find(x => x.id === +inp.dataset.id);
  if(!f) return;
  const campo = inp.dataset.campo;
  const raw = inp.value.trim();
  if(raw === ''){
    f[campo] = null;
  } else {
    const n = Number(raw);
    f[campo] = isFinite(n) ? n : null;
  }
  inp.classList.toggle('vacio', raw === '');
  actualizarFila(f);
  renderComparador();
});

$('#tablaPromedios').addEventListener('change', e => {
  const t = e.target;
  if(t.classList.contains('nombre-grupo')){
    const viejo = t.dataset.grupo;
    const nuevo = (t.value.trim() || '(sin grupo)');
    if(viejo === nuevo) return;
    for(const f of filas){
      if((f.grupo || '(sin grupo)') === viejo) f.grupo = nuevo;
    }
    // Actualizar combinaciones que usaban el nombre viejo
    for(const c of combinaciones){
      if(c.a === viejo) c.a = nuevo;
      if(c.b === viejo) c.b = nuevo;
    }
    renderPromedios();
    renderComparador();
  }
});

$('#tablaPromedios').addEventListener('click', e => {
  const t = e.target;
  if(t.classList.contains('btn-del-grupo')){
    const nombre = t.dataset.grupo;
    if(!confirm('¿Eliminar el componente "' + nombre + '" y todas sus mediciones?')) return;
    for(let i = filas.length - 1; i >= 0; i--){
      if((filas[i].grupo || '(sin grupo)') === nombre) filas.splice(i, 1);
    }
    combinaciones = combinaciones.filter(c => c.a !== nombre && c.b !== nombre);
    renderPromedios();
    renderComparador();
  }
});

/* =========================================================
   Agregar componente / agregar medida
   ========================================================= */
$('#btnAgregarComponente').addEventListener('click', () => {
  const existentes = new Set(construirGrupos().keys());
  let n = 1;
  while(existentes.has('Nuevo componente ' + n)) n++;
  const nombre = 'Nuevo componente ' + n;
  filas.push({
    id: idCounter++,
    nombre,
    hb: null,
    hrc: null,
    grupo: nombre
  });
  renderPromedios();
  renderComparador();
});

$('#btnAgregarMedida').addEventListener('click', () => {
  const grupos = construirGrupos();
  if(!grupos.size){
    alert('No hay componentes todavía.');
    return;
  }
  for(const g of grupos.values()){
    filas.push({
      id: idCounter++,
      nombre: g.nombre,
      hb: null,
      hrc: null,
      grupo: g.nombre
    });
  }
  renderPromedios();
  renderComparador();
});

/* =========================================================
   Comparador: eventos
   ========================================================= */
$('#listaComparaciones').addEventListener('change', e => {
  const t = e.target;
  const idx = +t.dataset.idx;
  if(isNaN(idx)) return;
  if(t.classList.contains('sel-a')) combinaciones[idx].a = t.value;
  if(t.classList.contains('sel-b')) combinaciones[idx].b = t.value;
  renderComparador();
});

$('#listaComparaciones').addEventListener('click', e => {
  const t = e.target;
  const idx = +t.dataset.idx;
  if(isNaN(idx)) return;
  if(t.classList.contains('btn-quitar')){
    combinaciones.splice(idx, 1);
    renderComparador();
  }
  if(t.classList.contains('btn-swap')){
    const c = combinaciones[idx];
    [c.a, c.b] = [c.b, c.a];
    renderComparador();
  }
});

$('#btnAgregar').addEventListener('click', () => {
  const nombres = [...construirGrupos().keys()];
  if(nombres.length < 2){ alert('Se necesitan al menos 2 componentes.'); return; }
  let a = nombres[0], b = nombres[1];
  if(combinaciones.length){
    const ult = combinaciones[combinaciones.length - 1];
    a = ult.a; b = ult.b;
  }
  combinaciones.push({ a, b });
  renderComparador();
});

$('#btnLimpiar').addEventListener('click', () => {
  combinaciones = [];
  renderComparador();
});

/* =========================================================
   Exportar CSV
   ========================================================= */
$('#btnCSV').addEventListener('click', () => {
  const grupos = construirGrupos();
  const lista = [...grupos.values()];
  const maxMed = lista.reduce((m,g) => Math.max(m, g.filas.length), 0);

  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const head = ['Componente','N mediciones','HB promedio','HRC promedio',
                'Rango HB','Rango HRC'];
  for(let i = 1; i <= maxMed; i++) head.push('Medición ' + i + ' HB', 'Medición ' + i + ' HRC');

  const lines = [head.map(q).join(';')];

  for(const g of lista){
    const phb = promedio(g.hb), phrc = promedio(g.hrc);
    const row = [
      g.nombre, g.filas.length,
      phb  === null ? '' : phb.toFixed(1),
      phrc === null ? '' : phrc.toFixed(1),
      rango(g.hb), rango(g.hrc)
    ];
    for(let i = 0; i < maxMed; i++){
      const f = g.filas[i];
      row.push(f && esNum(f.hb)  ? f.hb  : '');
      row.push(f && esNum(f.hrc) ? f.hrc : '');
    }
    lines.push(row.map(q).join(';'));
  }

  const blob = new Blob(['\uFEFF' + lines.join('\r\n')],
                        { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'promedios_dureza.csv';
  a.click();
  URL.revokeObjectURL(url);
});

/* =========================================================
   Init
   ========================================================= */
renderPromedios();
(function(){
  const nombres = [...construirGrupos().keys()];
  if(nombres.length >= 2){
    combinaciones.push({ a: nombres[0], b: nombres[1] });
  }
  renderComparador();
})();
</script>
